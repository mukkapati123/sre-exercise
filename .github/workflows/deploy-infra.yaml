name: Deploy Terraform
 
on:
  push:
    branches:
      - main
 
permissions:
  id-token: write
  contents: write
  pull-requests: write
 
jobs:
  deploy-terraform:
    uses: ./.github/workflows/reusable-tf-apply.yaml
    with:
      workdir: terraform.d/foundation
      terraform-version: '1.15.0'
      aws-region: eu-west-1
      iam-role-arn: 'arn:aws:iam::524370972027:role/sre-exercise-github-actions'
    secrets: inherit